name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    # The test setup is macOS-specific (it passes --use-mock-keychain because it replaces HOME), and
    # `but` comes from the GitButler app.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/install-gitbutler

      # Downloads the VS Code version pinned in .vscode-test.mjs into .vscode-test/ and runs the
      # tests in it, using real `but` and git.
      - name: Test
        run: npm test
