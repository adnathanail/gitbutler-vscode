name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    # The test setup is macOS-specific (it passes --use-mock-keychain because it replaces HOME), and
    # `but` comes from the GitButler app.
    runs-on: macos-latest
    env:
      # The GitButler version the extension is built and tested against, as "<version>-<build>".
      # The URL and checksum come from Homebrew's gitbutler cask (Casks/g/gitbutler.rb).
      GITBUTLER_VERSION: 0.22.3-3234
      GITBUTLER_SHA256: edf0f680c102ff86faee1d919ea2a6166fcbe6e3a98986706c91a38eed662f74
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Installs the pinned GitButler app and links its `but` CLI onto the PATH, as Homebrew does.
      # Homebrew itself only installs the latest version.
      - name: Install GitButler
        run: |
          archive="$RUNNER_TEMP/GitButler.app.tar.gz"
          curl -fsSL -o "$archive" \
            "https://releases.gitbutler.com/releases/release/$GITBUTLER_VERSION/macos/aarch64/GitButler.app.tar.gz"
          echo "$GITBUTLER_SHA256  $archive" | shasum -a 256 -c
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$RUNNER_TEMP/GitButler.app/Contents/MacOS/gitbutler-tauri" "$RUNNER_TEMP/bin/but"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - run: but --version

      # Downloads the VS Code version pinned in .vscode-test.mjs into .vscode-test/ and runs the
      # tests in it, using real `but` and git.
      - name: Test
        run: npm test
