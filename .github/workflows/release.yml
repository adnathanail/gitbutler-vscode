name: Release

# Run by hand: Actions > Release > Run workflow, choosing patch, minor or major. The new version is
# the latest release tag (vX.Y.Z) bumped by that.
#
# The extension's version has to be in package.json when it's packaged. This makes a release commit
# on top of main that sets it, tags that commit, and pushes only the tag: main keeps version 0.0.0.
# (The release commit is reachable from the tag, but isn't on main.) The packaged extension (.vsix)
# is attached to the GitHub release, to install with "Extensions: Install from VSIX…".

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # push the tag and create the GitHub release

jobs:
  release:
    # macOS, like CI, so the tests run against the pinned GitButler before anything is released.
    runs-on: macos-latest
    steps:
      - name: Check this is main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not $REF"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true # release tags aren't on main, so fetch them all

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major=${major#v}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unknown bump $BUMP"; exit 1 ;;
          esac
          version="v$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::$version is already tagged"
            exit 1
          fi
          echo "Releasing $version (previous release: ${latest:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Make the release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "${VERSION#v}" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"

      # Test and package what's about to be released, before anything is pushed.
      - uses: ./.github/actions/install-gitbutler

      - name: Test
        run: npm test

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          vsix="gitbutler-vscode-$VERSION.vsix"
          # --no-dependencies: the extension has no runtime dependencies to bundle, and skipping
          # vsce's `npm list` check avoids it silently packaging no files when that check fails.
          npx vsce package --no-dependencies --out "$vsix" < /dev/null
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

      - name: Push the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push origin "refs/tags/$VERSION"

      - name: Create the GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          VSIX: ${{ steps.package.outputs.vsix }}
          GH_TOKEN: ${{ github.token }}
        # Release commits aren't on main, so the previous release's tag isn't an ancestor of this
        # one, and GitHub would otherwise skip back to the last tag that is. Tell it where the notes
        # start.
        run: |
          gh release create "$VERSION" "$VSIX" --verify-tag --generate-notes --title "$VERSION" \
            ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
