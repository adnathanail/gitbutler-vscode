name: Install GitButler
description: >
  Installs the GitButler version the extension is built and tested against, and links its `but`
  CLI onto the PATH, as Homebrew does. Homebrew itself only installs the latest version.
  macOS (Apple silicon) runners only.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        # "<version>-<build>". The URL format and checksum come from Homebrew's gitbutler cask
        # (Casks/g/gitbutler.rb).
        GITBUTLER_VERSION: 0.22.2-3227
        GITBUTLER_SHA256: 48663c5dc5848d93dd43c941a4c337f762308fb142abf4734f842c3c4357d07a
      run: |
        archive="$RUNNER_TEMP/GitButler.app.tar.gz"
        curl -fsSL -o "$archive" \
          "https://releases.gitbutler.com/releases/release/$GITBUTLER_VERSION/macos/aarch64/GitButler.app.tar.gz"
        echo "$GITBUTLER_SHA256  $archive" | shasum -a 256 -c
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        mkdir -p "$RUNNER_TEMP/bin"
        ln -s "$RUNNER_TEMP/GitButler.app/Contents/MacOS/gitbutler-tauri" "$RUNNER_TEMP/bin/but"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/bin/but" --version
